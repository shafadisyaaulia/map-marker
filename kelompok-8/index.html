<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Interaktif – Kelompok 8</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-badge">K8</div>
            <div>
                <div class="brand-title">Peta Kelompok 8</div>
                <div class="brand-sub">Banda Aceh</div>
            </div>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section-label">Pilih Basemap</div>
        <div class="basemap-switcher" id="basemap-switcher">
            <button class="basemap-btn active" data-type="streets">
                <span class="basemap-icon">🗺</span>
                <span>Streets</span>
            </button>
            <button class="basemap-btn" data-type="satellite">
                <span class="basemap-icon">🛰</span>
                <span>Satellite</span>
            </button>
            <button class="basemap-btn" data-type="dark">
                <span class="basemap-icon">🌙</span>
                <span>Dark</span>
            </button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section-label">Daftar Lokasi</div>
        <ul class="location-list" id="location-list"></ul>

        <div class="sidebar-divider"></div>

        <button class="reset-btn" id="reset-zoom-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset Tampilan
        </button>
    </aside>

    <!-- MAP -->
    <main class="map-area">
        <div id="map"></div>
        <div class="map-overlay-info" id="coords-display">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
            Hover peta untuk melihat koordinat
        </div>
    </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="data/maulizar.js"></script>
<script src="data/dea.js"></script>
<script src="script.js"></script>
</body>
</html>
